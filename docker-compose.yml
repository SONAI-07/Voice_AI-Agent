services:

  postgres:
    image: postgres:16
    container_name: customercare-postgres
    environment:
      POSTGRES_DB: customercare
      POSTGRES_USER: customercare
      POSTGRES_PASSWORD: customercare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: customercare-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: